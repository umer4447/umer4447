<svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#11141d"/>
    </linearGradient>
    <linearGradient id="linearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5e6ad2"/>
      <stop offset="100%" stop-color="#454f9e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { fill: #e8eaf0; font-size: 15px; font-weight: 600; }
      .sub { fill: #8b93a5; font-size: 10.5px; letter-spacing: .3px; }
      .num { fill: #4a5164; font-size: 10px; font-weight: 700; letter-spacing: 1.3px; }
      .track { fill: none; stroke: #262c3a; stroke-width: 2; }
      .flow { fill: none; stroke: #d97757; stroke-width: 2; stroke-dasharray: 10 14; opacity: .85;
              animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .fadein { animation: fadein .9s ease-out both; }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      .d1 { animation-delay: .05s } .d2 { animation-delay: .2s } .d3 { animation-delay: .35s }
      .d4 { animation-delay: .5s } .d5 { animation-delay: .65s } .d6 { animation-delay: .8s } .d7 { animation-delay: .95s }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .fadein, .mover { animation: none !important; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="330" rx="16" fill="url(#bgGrad)" stroke="#1e2430" stroke-width="1.5"/>

  <!-- header -->
  <text x="40" y="44" fill="#e8eaf0" font-size="20" font-weight="700">AI-Native Development Pipeline</text>
  <text x="40" y="64" fill="#8b93a5" font-size="12">idea &#8594; spec &#8594; ticket &#8594; design &#8594; code &#8594; review &#8594; production &#8212; one continuous loop</text>
  <circle cx="930" cy="40" r="4.5" fill="#d97757" class="pulse"/>
  <text x="920" y="44" text-anchor="end" fill="#8b93a5" font-size="11" letter-spacing="1">LIVE</text>

  <!-- connector tracks -->
  <path class="track" d="M 210 125 H 265"/>
  <path class="flow"  d="M 210 125 H 265"/>
  <path class="track" d="M 435 125 H 490"/>
  <path class="flow"  d="M 435 125 H 490"/>
  <path class="track" d="M 660 125 H 715"/>
  <path class="flow"  d="M 660 125 H 715"/>
  <path class="track" d="M 885 153 C 885 195 885 200 830 200 L 715 200 C 682 200 682 225 682 230"/>
  <path class="flow"  d="M 885 153 C 885 195 885 200 830 200 L 715 200 C 682 200 682 225 682 230"/>
  <path class="track" d="M 570 258 H 515"/>
  <path class="flow"  d="M 570 258 H 515"/>
  <path class="track" d="M 340 258 H 285"/>
  <path class="flow"  d="M 340 258 H 285"/>
  <path class="track" d="M 120 230 C 120 195 120 180 120 153" stroke-dasharray="3 6"/>

  <!-- moving pulse dot -->
  <circle r="4.5" fill="#ffb597" filter="url(#glow)" class="mover">
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M 100 125 H 490 H 715 H 885 C 885 195 885 200 830 200 L 715 200 C 682 200 682 225 682 230 L 682 258 H 285 H 120 C 120 195 120 180 120 125"/>
  </circle>

  <!-- ROW 1 -->
  <g class="fadein d1">
    <rect x="30" y="97" width="180" height="56" rx="12" fill="#161a24" stroke="#d97757" stroke-width="1.2"/>
    <text class="num" x="44" y="91">01 &#183; IDEATE</text>
    <g filter="url(#glow)"><text x="46" y="132" fill="#d97757" font-size="20" font-weight="700">&#10022;</text></g>
    <text class="label" x="72" y="122">Claude</text>
    <text class="sub" x="72" y="138">architecture &amp; planning</text>
  </g>
  <g class="fadein d2">
    <rect x="255" y="97" width="180" height="56" rx="12" fill="#161a24" stroke="#39404f" stroke-width="1.2"/>
    <text class="num" x="269" y="91">02 &#183; SPEC</text>
    <text x="270" y="130" fill="#e8eaf0" font-size="19" font-weight="800">N</text>
    <text class="label" x="296" y="122">Notion</text>
    <text class="sub" x="296" y="138">PRDs &amp; documentation</text>
  </g>
  <g class="fadein d3">
    <rect x="480" y="97" width="180" height="56" rx="12" fill="#161a24" stroke="#5e6ad2" stroke-width="1.2"/>
    <text class="num" x="494" y="91">03 &#183; TRACK</text>
    <g fill="url(#linearGrad)">
      <rect x="495" y="113" width="6" height="6" rx="2"/><rect x="504" y="113" width="6" height="6" rx="2"/>
      <rect x="495" y="122" width="6" height="6" rx="2"/><rect x="504" y="122" width="6" height="6" rx="2" opacity=".5"/>
    </g>
    <text class="label" x="520" y="122">Linear</text>
    <text class="sub" x="520" y="138">sprints &amp; issues</text>
  </g>
  <g class="fadein d4">
    <rect x="705" y="97" width="180" height="56" rx="12" fill="#161a24" stroke="#d97757" stroke-width="1.2"/>
    <text class="num" x="719" y="91">04 &#183; DESIGN</text>
    <g filter="url(#glow)">
      <circle cx="729" cy="123" r="8" fill="none" stroke="#d97757" stroke-width="2"/>
      <circle cx="729" cy="123" r="2.5" fill="#d97757"/>
    </g>
    <text class="label" x="747" y="122">Claude Design</text>
    <text class="sub" x="747" y="138">UI &amp; prototypes</text>
  </g>

  <!-- ROW 2 -->
  <g class="fadein d5">
    <rect x="590" y="230" width="180" height="56" rx="12" fill="#161a24" stroke="#d97757" stroke-width="1.2"/>
    <text class="num" x="604" y="224">05 &#183; BUILD</text>
    <g filter="url(#glow)">
      <text x="604" y="266" fill="#d97757" font-size="15" font-weight="800" font-family="monospace">&#62;_</text>
    </g>
    <text class="label" x="634" y="255">Claude Code</text>
    <text class="sub" x="634" y="271">agentic implementation</text>
  </g>
  <g class="fadein d6">
    <rect x="335" y="230" width="180" height="56" rx="12" fill="#161a24" stroke="#39404f" stroke-width="1.2"/>
    <text class="num" x="349" y="224">06 &#183; REVIEW</text>
    <g stroke="#8b93a5" stroke-width="2" fill="none">
      <circle cx="354" cy="246" r="4"/>
      <circle cx="354" cy="270" r="4"/>
      <circle cx="372" cy="270" r="4"/>
      <path d="M 354 250 V 266 M 372 266 V 260 C 372 251 363 252 359 249"/>
    </g>
    <text class="label" x="388" y="255">GitHub PRs</text>
    <text class="sub" x="388" y="271">clean, reviewed merges</text>
  </g>
  <g class="fadein d7">
    <rect x="30" y="230" width="255" height="56" rx="12" fill="#161a24" stroke="#e8eaf0" stroke-width="1.2"/>
    <text class="num" x="44" y="224">07 &#183; SHIP</text>
    <g filter="url(#glow)"><path d="M 54 248 L 68 270 H 40 Z" fill="#e8eaf0"/></g>
    <text class="label" x="82" y="255">Vercel Deployment</text>
    <text class="sub" x="82" y="271">production, continuously</text>
  </g>

  <!-- feedback label -->
  <text x="132" y="186" fill="#4a5164" font-size="10" letter-spacing="1">ITERATE &#8593;</text>
</svg>
